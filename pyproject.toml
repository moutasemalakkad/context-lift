[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contextlift"
version = "0.1.0"
description = "Measure whether curated business context makes a data agent more accurate: mine a gold set, gate it, baseline it, triage the failures, and track each round of enrichment with a guard against climbing on noise."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Moutasem Akkad", email = "moutasemalakkad@gmail.com" }]
maintainers = [{ name = "Moutasem Akkad", email = "moutasemalakkad@gmail.com" }]
keywords = ["text-to-sql", "evaluation", "execution-accuracy", "spider", "bird"]
# Core is pure stdlib on purpose: the SQLite backend, the comparator, the
# metrics, and the gate run from a fresh clone with no third-party deps.
dependencies = []

[project.scripts]
contextlift = "context_lift.cli:main"

[project.optional-dependencies]
# Cloud / LLM backends live behind extras so the fast path stays stdlib-only.
bigquery = ["google-cloud-bigquery>=3.0"]
# <3.0.0: 3.x changes function calling on generate_content, which chat.py drives by hand.
gemini = ["google-genai>=1.0,<3.0.0"]
lookml = ["lkml>=1.3.7"]
# The third warehouse. No server to stand up, installs in milliseconds, and
# reads Parquet and CSV directly, so a person with a folder of extracts can
# run a round without setting anything up.
duckdb = ["duckdb>=1.0"]
# Reading table documentation out of Google Cloud's Knowledge Catalog. The
# behaviour is tested offline against a fake; only the transport needs this.
catalog = ["google-cloud-dataplex>=2.0"]
# The agent under test: Conversational Analytics. The request body and the
# answer parser are tested offline against dicts; only the call needs this.
ca = ["google-cloud-geminidataanalytics>=0.13"]
# The spec repo and Apache Ossie files are YAML in practice, because a person
# authors them and YAML takes comments. Both readers also take .json, which
# needs nothing, so the core stays stdlib-only.
yaml = ["pyyaml>=6"]
# lkml is in dev so the LookML tests actually run. Without it `make install`
# gave a fresh clone ten failures against a README promising a green suite,
# and skipping them would have made the suite honest without testing the path.
# google-cloud-dataplex is here for the same reason as lkml: without it six
# catalog tests SKIP on a fresh clone while running on a machine that
# happens to have it, which is a suite that is honest without testing the
# path. Importing it needs no credential; the tests use offline fakes.
# duckdb and geminidataanalytics were added 2026-09-12 for exactly the reason
# above, found by running the suite in a FRESH clone: 13 skips there against 11
# on the machine this was written on. The two extra were test_duckdb.py and the
# ca_api runner test, both skipping on a missing import that happened to be
# installed here from other work. So the DuckDB backend and the
# Conversational Analytics runner were tested on one laptop and nowhere else,
# while the suite reported green. That is the same "honest without testing the
# path" fault the lines above already refuse.
#
# statsmodels is deliberately NOT here. It skips two tests that cross-check
# this project's exact arithmetic against a reference implementation, and it
# skips identically on every machine, so the suite is not lying about them.
dev = ["pytest>=8.0", "lkml>=1.3.7", "pyyaml>=6", "google-cloud-dataplex>=2.0",
       "duckdb>=1.0", "google-cloud-geminidataanalytics>=0.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/context_lift"]

[tool.pytest.ini_options]
# src-layout: let pytest import the package without an editable install,
# so `pytest` works the same in CI and from a bare checkout.
pythonpath = ["src", "."]
testpaths = ["tests"]
