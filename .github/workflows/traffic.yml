name: traffic

# GitHub keeps repository traffic for 14 days and then deletes it. Launch week
# is the only week whose funnel matters and it cannot be reconstructed after
# the fact, so a daily snapshot is appended to `metrics.jsonl` on the `metrics`
# branch. One JSON object per line, never rewritten.
#
# The data lives on its own branch so that a daily commit never touches main's
# history. Read it with:
#   git fetch origin metrics && git show origin/metrics:metrics.jsonl
on:
  schedule:
    # 06:17 UTC. Off the hour because the hour is when every cron on GitHub
    # fires at once and the queue runs late.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  # `administration: read` is not a key a workflow may set, whatever the REST
  # docs for the traffic endpoints say about the permission they want: the
  # dispatch is rejected with "Unexpected value 'administration'". The traffic
  # endpoints want push access, which contents: write already carries for the
  # workflow's own repository. Set a TRAFFIC_TOKEN secret if that stops being
  # true; the step below prefers it when present.
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: metrics

      - name: append today's row
        env:
          GH_TOKEN: ${{ secrets.TRAFFIC_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Read one endpoint, or stop the run. The first green run of this
          # workflow recorded `{"message":"Resource not accessible by
          # integration","status":"403"}` in place of every traffic figure and
          # still reported success: the traffic endpoints refuse the default
          # GITHUB_TOKEN, gh printed the error body, and jq embedded it as
          # data. A monitor that logs nulls during a launch is worse than no
          # monitor, so the shape is checked and a bad answer fails the job.
          read_api () {
            local path="$1" shape="$2" body
            if ! body=$(gh api "$path" 2>&1); then
              echo "::error::GET $path failed: $body" >&2
              exit 1
            fi
            if ! printf '%s' "$body" | jq -e "$shape" >/dev/null 2>&1; then
              echo "::error::GET $path answered the wrong shape ($shape): $body" >&2
              echo "::error::If this is a 403, the traffic endpoints need a PAT." >&2
              echo "::error::Create a fine-grained token with Administration:" >&2
              echo "::error::read-only on this repo and save it as TRAFFIC_TOKEN." >&2
              exit 1
            fi
            printf '%s' "$body"
          }

          views=$(read_api "repos/$REPO/traffic/views" '.count | type == "number"')
          clones=$(read_api "repos/$REPO/traffic/clones" '.count | type == "number"')
          # Referrers and paths are legitimately `[]` on a quiet day, so the
          # only thing worth asserting is that they are arrays at all.
          referrers=$(read_api "repos/$REPO/traffic/popular/referrers" 'type == "array"')
          paths=$(read_api "repos/$REPO/traffic/popular/paths" 'type == "array"')
          repo=$(read_api "repos/$REPO" '.stargazers_count | type == "number"')

          # -c keeps it one line, which is what makes the file appendable.
          # Referrers are the diagnostic that matters: they say which channel
          # sent people, and so whether a flat day is a traffic problem or a
          # conversion problem.
          jq -nc \
            --argjson views "$views" \
            --argjson clones "$clones" \
            --argjson referrers "$referrers" \
            --argjson paths "$paths" \
            --argjson repo "$repo" \
            '{asof: (now | todate),
              stars: $repo.stargazers_count,
              forks: $repo.forks_count,
              open_issues: $repo.open_issues_count,
              views_14d: {count: $views.count, uniques: $views.uniques},
              clones_14d: {count: $clones.count, uniques: $clones.uniques},
              views_daily: $views.views,
              referrers: $referrers,
              paths: $paths}' >> metrics.jsonl

          echo "appended: $(tail -1 metrics.jsonl | jq -c '{asof, stars, views_14d}')"

      - name: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.jsonl
          # Nothing to commit means the API returned the same bytes twice in a
          # day, which is a re-run and not a failure.
          git diff --staged --quiet || git commit -m "traffic $(date -u +%F)"
          git push
